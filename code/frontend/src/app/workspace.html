<!doctype html>
<html lang="zh-CN"
  ><head
    ><meta charset="UTF-8" /><meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    /><title>StudyPilot · 把时间留给成长</title
    ><!-- @styles --></head
  ><body class="auth-landing"
    ><svg
      class="brand-symbols"
      width="0"
      height="0"
      aria-hidden="true"
      style="position:absolute;pointer-events:none"
    >
      <defs>
        <linearGradient id="pilot-brand-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9baabe" />
          <stop offset="1" stop-color="#8c7f98" />
        </linearGradient>
        <symbol id="studypilot-brand-mark" viewBox="0 0 40 40">
          <rect x="1" y="1" width="38" height="38" rx="12" fill="url(#pilot-brand-gradient)" />
          <path
            d="M10 13.5c4-.8 7 .1 10 2.8v14c-3-2.5-6-3.3-10-2.7z"
            fill="#f7f3eb"
            fill-opacity=".92"
          />
          <path d="M20 16.3c3-2.7 6-3.6 10-2.8v14c-4-.6-7 .2-10 2.8z" fill="#ece8f2" />
          <path d="M20 17v12" stroke="#b7aabd" stroke-width="1" />
          <path
            d="M10 9.5c8-4.2 17-1.1 21 4.8"
            fill="none"
            stroke="#f6f1e9"
            stroke-opacity=".65"
            stroke-width="1"
            stroke-linecap="round"
          />
          <circle cx="30.5" cy="10.5" r="2.3" fill="#e5d5be" />
        </symbol>
      </defs></svg
    ><section id="landing-page" class="landing-page" aria-label="StudyPilot 欢迎页"
      ><img
        class="landing-art"
        src="/assets/floral-scene.jpg"
        alt="蓝紫色花卉画作，营造安静的学习与规划空间" /><div
        class="landing-wash"
        aria-hidden="true"
      ></div
      ><div id="landing-distortion" class="landing-distortion"
        ><canvas id="landing-distortion-canvas" aria-hidden="true"></canvas></div
      ><header class="landing-brand">StudyPilot</header
      ><div class="landing-copy"
        ><span class="landing-eyebrow">MAKE ROOM FOR GROWTH</span
        ><h1>你的学习规划<br />成长助手</h1></div
      ><div class="landing-entry"
        ><div id="login-circular-wrap" class="login-circular-wrap"
          ><div id="login-circular-text" class="login-circular-text"
            ><div class="login-circular-tilt" id="login-circular-tilt"
              ><span class="login-circular-line" aria-hidden="true"></span
              ><div id="login-circular-ring" class="login-circular-ring" aria-hidden="true"></div
              ><svg class="circular-drag-target" viewBox="0 0 200 200" aria-hidden="true">
                <circle
                  cx="100"
                  cy="100"
                  r="91"
                  fill="none"
                  stroke="transparent"
                  stroke-width="25"
                /></svg></div></div
          ><button
            id="landing-login-orb"
            class="landing-login-orb"
            onclick="openLandingLogin()"
            aria-label="打开登录或注册面板"
            aria-haspopup="dialog"
            aria-expanded="false"
            ><span class="orb-content" aria-hidden="true"
              ><svg class="login-entry-arrow" viewBox="0 0 64 64" fill="none" focusable="false">
                <path
                  d="M15 49 49 15M17 15h32v32"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                /></svg></span></button></div></div></section
    ><div class="app"
      ><header class="app-header"
        ><div class="app-header-inner"
          ><div class="brand"
            ><span class="brand-wordmark">Study<em>Pilot</em></span></div
          ><nav class="gooey-nav gooey-nav--sm gooey-nav--framed app-nav" aria-label="主导航"
            ><span class="gooey-nav__rim" aria-hidden="true"></span
            ><div class="gooey-nav__stage" id="app-nav-stage"
              ><canvas class="gooey-nav__canvas" id="app-nav-canvas" aria-hidden="true"></canvas
              ><span class="gooey-nav__fallback" id="app-nav-fallback" aria-hidden="true"></span
              ><ul class="gooey-nav__list" id="app-nav-list"
                ><li class="gooey-nav__item" data-gooey-index="0"
                  ><button type="button" class="gooey-nav__link" data-page="plan"
                    >每日计划</button
                  ></li
                ><li class="gooey-nav__item" data-gooey-index="1"
                  ><button type="button" class="gooey-nav__link" data-page="matrix"
                    >象限分化</button
                  ></li
                ></ul
              ><ul
                class="gooey-nav__list gooey-nav__list--active"
                id="app-nav-overlay"
                aria-hidden="true"
                ><li class="gooey-nav__item"><span class="gooey-nav__link">每日计划</span></li
                ><li class="gooey-nav__item"><span class="gooey-nav__link">象限分化</span></li></ul
              ></div
            ></nav
          ><div class="header-account"
            ><span class="date-top header-date"></span
            ><button class="header-help" onclick="showHelp()" aria-label="查看产品说明">ⓘ</button
            ><button
              class="header-profile"
              id="header-profile"
              onclick="openPersonal()"
              aria-label="打开个人空间"
              ><span class="avatar" id="profile-avatar">访</span
              ><span id="username">登录 / 注册</span
              ><span class="profile-chevron" aria-hidden="true">⌄</span></button
            ></div
          ></div
        ></header
      ><main class="main"><div class="content" id="content"></div></main></div
    ><div id="modal-root"></div><div id="toast-root"></div
    ><button
      id="task-fab"
      class="task-fab"
      aria-label="添加灵活任务；拖动可移动按钮位置"
      title="点击添加灵活任务 · 拖动移动位置"
      ><span aria-hidden="true"
        ><svg
          class="ui-symbol"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M12 5v14M5 12h14" /></svg></span></button
    ><div id="task-delete-dock" class="task-delete-dock" aria-hidden="true"
      ><div class="delete-dock-slot"></div><strong>松手删除任务</strong
      ><small>松手后碎纸 · 可撤销</small></div
    ><div id="shred-announcement" class="sr-only" role="status" aria-live="polite"></div>

    <!-- @script:grid-distortion.js -->

    <!-- @script:gooey-navigation.js -->
    <!-- @script:router.js -->
    <!-- @script:local-state.js --><!-- @script:workspace.js -->
    <!-- @extensions --><svg class="surface-filters" aria-hidden="true" width="0" height="0">
      <defs>
        <filter id="floral-ink" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation=".7" result="soft" />
          <feConvolveMatrix
            in="soft"
            order="3"
            kernelMatrix="0 -1 0 -1 4 -1 0 -1 0"
            bias="0"
            preserveAlpha="true"
            result="edges"
          />
          <feColorMatrix
            in="edges"
            type="matrix"
            values="-.65 -.65 -.65 0 1 -.65 -.65 -.65 0 1 -.65 -.65 -.65 0 1 0 0 0 1 0"
            result="ink"
          />
          <feBlend in="SourceGraphic" in2="ink" mode="multiply" />
        </filter>
      </defs></svg></body
></html>
