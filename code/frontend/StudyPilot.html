 class="task-fab" aria-label="添加灵活任务；拖动可移动按钮位置" title="点击添加灵活任务 · 拖动移动位置"><span aria-hidden="true">＋</span></button><div id="task-delete-dock" class="task-delete-dock" aria-hidden="true"><div class="delete-dock-slot"></div><strong>松手删除任务</strong><small>松手后碎纸 · 可撤销</small></div><div id="shred-announcement" class="sr-only" role="status" aria-live="polite"></div>

<script>
// GridDistortion: original shaders and field simulation adapted from the supplied component.
(function(){
const VERTEX = `#version 300 es
in vec2 aPosition;
out vec2 vUv;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const FRAGMENT = `#version 300 es
precision highp float;
uniform sampler2D uImage;
uniform sampler2D uField;
uniform vec2 uGrid;
uniform vec2 uCover;
uniform vec2 uPosition;
uniform float uSoftness;
uniform float uChroma;
uniform float uReveal;
in vec2 vUv;
out vec4 outColor;

vec2 fieldAt(ivec2 cell) {
  return texelFetch(uField, clamp(cell, ivec2(0), ivec2(uGrid) - 1), 0).rg;
}

vec3 sampleImage(vec2 uv) {
  return texture(uImage, uv * uCover + (vec2(1.0) - uCover) * uPosition).rgb;
}

void main() {
  vec2 uv = vec2(vUv.x, 1.0 - vUv.y);
  vec2 g = uv * uGrid;
  vec2 blocky = fieldAt(ivec2(floor(g)));
  vec2 p = g - 0.5;
  ivec2 base = ivec2(floor(p));
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  vec2 soft = mix(
    mix(fieldAt(base), fieldAt(base + ivec2(1, 0)), f.x),
    mix(fieldAt(base + ivec2(0, 1)), fieldAt(base + ivec2(1, 1)), f.x),
    f.y
  );
  vec2 shift = mix(blocky, soft, uSoftness);
  float spread = uChroma * 0.35;
  vec3 color = vec3(
    sampleImage(uv - shift * (1.0 + spread)).r,
    sampleImage(uv - shift).g,
    sampleImage(uv - shift * (1.0 - spread)).b
  );
  outColor = vec4(color * uReveal, uReveal);
}`;

const MODES = ['drag', 'push', 'swirl'];
const GAIN = 18;
const RIPPLE_LIFE = 1.6;

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

const hash = (x, y, z) => {
  let h = Math.imul(x, 0x27d4eb2d) ^ Math.imul(y, 0x165667b1) ^ Math.imul(z, 0x2c1b3c6d);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 2147483648 - 1;
};

const compile = (gl, type, source) => {
  const shader = gl.createShader(type);
  if (!shader) return null;
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
  gl.deleteShader(shader);
  return null;
};


function mountStudyGridDistortion(root,canvas,options={}){
const {imageSrc,grid=60,radius=.11,strength=.24,relaxation=.95,mode='push',softness=.08,chroma=0,idle=0,clickRipple=true,intro=false}=options;
  const settings = {
    grid: clamp(Math.round(grid), 2, 120),
    radius: clamp(radius, 0.01, 1),
    strength: Math.max(0, strength),
    relaxation: clamp(relaxation, 0, 0.995),
    mode: MODES.includes(mode) ? mode : 'drag',
    softness: clamp(softness, 0, 1),
    chroma: clamp(chroma, 0, 2),
    idle: clamp(idle, 0, 1),
    clickRipple,
    intro
  };
const settingsRef={current:settings},controlRef={current:null};
    const gl = canvas?.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false });
    if (!root || !canvas || !gl) return undefined;

    const vertex = compile(gl, gl.VERTEX_SHADER, VERTEX);
    const fragment = compile(gl, gl.FRAGMENT_SHADER, FRAGMENT);
    const program = gl.createProgram();
    if (!vertex || !fragment || !program) return undefined;
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return undefined;
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, 'aPosition');
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {};
    for (const name of ['uImage', 'uField', 'uGrid', 'uCover', 'uPosition', 'uSoftness', 'uChroma', 'uReveal']) {
      uniforms[name] = gl.getUniformLocation(program, name);
    }
    gl.uniform1i(uniforms.uImage, 0);
    gl.uniform1i(uniforms.uField, 1);

    const imageTexture = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, imageTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    const fieldTexture = gl.createTexture();
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, fieldTexture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    const reduce = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
    const pointer = { x: 0, y: 0, px: 0, py: 0, inside: false };
    const state = {
      width: 1,
      height: 1,
      cols: 0,
      rows: 0,
      sim: new Float32Array(0),
      out: new Float32Array(0),
      ripples: [],
      time: 0,
      reveal: 0,
      loaded: false,
      imageAspect: 1,
      request: 0,
      lastMove: -10,
      phantom: 1
    };
    let raf = 0;
    let last = 0;
    let visible = true;
    let alive = true;

    const layout = () => {
      const cols = settingsRef.current.grid;
      const rows = Math.max(1, Math.round((cols * state.height) / state.width));
      if (cols === state.cols && rows === state.rows) return;
      state.cols = cols;
      state.rows = rows;
      state.sim = new Float32Array(cols * rows * 2);
      state.out = new Float32Array(cols * rows * 2);
      gl.activeTexture(gl.TEXTURE1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, cols, rows, 0, gl.RG, gl.FLOAT, state.out);
    };

    const scramble = () => {
      const { sim, cols, rows, width, height } = state;
      const reach = Math.min(width, height) * 0.12;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const i = (row * cols + col) * 2;
          sim[i] = (hash(col + 1, row + 1, 11) * reach) / width;
          sim[i + 1] = (hash(col + 1, row + 1, 23) * reach) / height;
        }
      }
    };

    const brush = (s, x, y, dx, dy, weight) => {
      const { sim, cols, rows, width, height } = state;
      const reach = Math.max(1, s.radius * width);
      const cellWidth = width / cols;
      const cellHeight = height / rows;
      const speed = Math.hypot(dx, dy);
      const limit = (0.25 + s.strength) * 0.4 * width;
      const fromCol = Math.max(0, Math.floor((x - reach) / cellWidth));
      const toCol = Math.min(cols - 1, Math.floor((x + reach) / cellWidth));
      const fromRow = Math.max(0, Math.floor((y - reach) / cellHeight));
      const toRow = Math.min(rows - 1, Math.floor((y + reach) / cellHeight));
      for (let row = fromRow; row <= toRow; row++) {
        for (let col = fromCol; col <= toCol; col++) {
          const ox = (col + 0.5) * cellWidth - x;
          const oy = (row + 0.5) * cellHeight - y;
          const distance = Math.hypot(ox, oy);
          if (distance >= reach) continue;
          const t = 1 - (distance / reach) ** 2;
          const k = s.strength * GAIN * weight * t * t;
          let vx = dx;
          let vy = dy;
          if (s.mode !== 'drag') {
            const nx = distance > 0 ? ox / distance : 0;
            const ny = distance > 0 ? oy / distance : 0;
            vx = s.mode === 'push' ? nx * speed : -ny * speed;
            vy = s.mode === 'push' ? ny * speed : nx * speed;
          }
          const i = (row * cols + col) * 2;
          const px = sim[i] * width + vx * k;
          const py = sim[i + 1] * height + vy * k;
          const length = Math.hypot(px, py);
          const scale = length > 0 ? (limit * Math.tanh(length / limit)) / length : 0;
          sim[i] = (px * scale) / width;
          sim[i + 1] = (py * scale) / height;
        }
      }
    };

    const wander = t => [
      state.width * (0.5 + 0.34 * Math.sin(t * 0.43) + 0.08 * Math.sin(t * 1.21 + 1.7)),
      state.height * (0.5 + 0.3 * Math.sin(t * 0.61 + 0.9) + 0.08 * Math.cos(t * 1.03 + 0.4))
    ];

    const simulate = (s, dt) => {
      const { sim } = state;
      const decay = Math.pow(s.relaxation, dt * 60);
      let peak = 0;
      for (let i = 0; i < sim.length; i++) {
        sim[i] *= decay;
        if (Math.abs(sim[i]) < 1e-5) sim[i] = 0;
        else peak = Math.max(peak, Math.abs(sim[i]));
      }
      if (s.strength <= 0) return peak;

      const dx = pointer.x - pointer.px;
      const dy = pointer.y - pointer.py;
      pointer.px = pointer.x;
      pointer.py = pointer.y;
      if (pointer.inside && (dx || dy)) {
        state.lastMove = state.time;
        brush(s, pointer.x, pointer.y, dx, dy, 1);
        peak = Math.max(peak, 1e-3);
      }

      const drift = reduce ? 0 : s.idle;
      const resting = state.time - state.lastMove > 2.5;
      state.phantom = clamp(state.phantom + (resting ? dt : -dt * 3), 0, 1);
      if (drift > 0 && state.phantom > 0) {
        const [x, y] = wander(state.time);
        const [px, py] = wander(state.time - dt);
        brush(s, x, y, x - px, y - py, drift * 0.6 * state.phantom * state.phantom);
      }
      return peak;
    };

    const compose = s => {
      const { sim, out, cols, rows, width, height, time } = state;
      out.set(sim);
      if (state.ripples.length) {
        const cellWidth = width / cols;
        const cellHeight = height / rows;
        const span = Math.hypot(width, height);
        const band = Math.max(cellWidth, cellHeight) * 1.2 + span * 0.03;
        const amount = width * (0.03 + s.strength * 0.3);
        state.ripples = state.ripples.filter(ripple => time - ripple.start < RIPPLE_LIFE);
        for (const ripple of state.ripples) {
          const age = (time - ripple.start) / RIPPLE_LIFE;
          const front = age * span * 0.75;
          const fade = (1 - age) ** 2;
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const ox = (col + 0.5) * cellWidth - ripple.x;
              const oy = (row + 0.5) * cellHeight - ripple.y;
              const distance = Math.hypot(ox, oy);
              const wave = Math.exp(-(((distance - front) / band) ** 2)) * fade;
              if (wave < 0.002 || distance === 0) continue;
              const i = (row * cols + col) * 2;
              out[i] += (ox / distance) * ((wave * amount) / width);
              out[i + 1] += (oy / distance) * ((wave * amount) / height);
            }
          }
        }
      }
    };

    const render = () => {
      const { width, height } = state;
      const aspect = width / height;
      const cover = aspect > state.imageAspect ? [1, state.imageAspect / aspect] : [aspect / state.imageAspect, 1];
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.activeTexture(gl.TEXTURE1);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, state.cols, state.rows, gl.RG, gl.FLOAT, state.out);
      const s = settingsRef.current;
      gl.uniform2f(uniforms.uGrid, state.cols, state.rows);
      gl.uniform2f(uniforms.uCover, cover[0], cover[1]);
      const mobile = window.matchMedia?.('(max-width: 700px)').matches;
      gl.uniform2f(uniforms.uPosition, mobile ? .5 : .42, mobile ? .44 : .5);
      gl.uniform1f(uniforms.uSoftness, s.softness);
      gl.uniform1f(uniforms.uChroma, s.chroma);
      gl.uniform1f(uniforms.uReveal, state.reveal);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };

    const frame = now => {
      raf = 0;
      if (!alive || !visible || document.hidden) return;
      const s = settingsRef.current;
      const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
      last = now;
      state.time += dt;
      layout();
      if (state.loaded) state.reveal = reduce ? 1 : Math.min(1, state.reveal + dt / 0.6);
      const peak = simulate(s, dt);
      compose(s);
      render();
      const busy = state.loaded && (peak > 0 || state.ripples.length > 0 || (s.idle > 0 && !reduce) || state.reveal < 1);
      if (busy) raf = requestAnimationFrame(frame);
      else last = 0;
    };

    const wake = () => {
      if (raf || !alive || !visible || document.hidden) return;
      raf = requestAnimationFrame(frame);
    };

    const load = src => {
      const request = ++state.request;
      if (!src) return;
      const image = new Image();
      image.crossOrigin = 'anonymous';
      image.decoding = 'async';
      image.onload = () => {
        if (!alive || request !== state.request) return;
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, imageTexture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        state.imageAspect = image.naturalWidth / Math.max(1, image.naturalHeight);
        layout();
        if (settingsRef.current.intro && !reduce) scramble();
        state.loaded = true;
        if (!settingsRef.current.intro || reduce) state.reveal = 1;
        compose(settingsRef.current); render(); options.onReady?.();
        wake();
      };
      image.onerror = () => { if (alive && request === state.request) { state.loaded = false; options.onError?.(); } };
      image.src = src;
    };

    const onPointerMove = event => {
      const rect = root.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const inside = x >= 0 && y >= 0 && x <= rect.width && y <= rect.height;
      if (reduce) return;
      if (inside && !pointer.inside) {
        pointer.px = x;
        pointer.py = y;
      }
      pointer.x = x;
      pointer.y = y;
      pointer.inside = inside;
      if (inside && !reduce) wake();
    };

    const onPointerDown = event => {
      if (!settingsRef.current.clickRipple || reduce || event.button !== 0 || event.target?.closest?.('button,input,textarea,select,a,[role=button]')) return;
      const rect = root.getBoundingClientRect();

function useDemoCourseImage(){const svg='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360"><rect width="800" height="360" rx="14" fill="#f4f7f1"/><text x="32" y="48" fill="#3b6348" font-size="24" font-family="sans-serif">2026 秋季学期 · 示例课程表</text><g font-family="sans-serif" font-size="16" fill="#536d59"><text x="40" y="100">时间</text><text x="185" y="100">星期一</text><text x="370" y="100">星期三</text><text x="570" y="100">星期六</text><path d="M30 120H770 M30 220H770 M150 78V330 M340 78V330 M540 78V330" stroke="#d4dfd0"/><text x="36" y="158">08:00</text><text x="36" y="186">09:40</text><text x="175" y="158">高等数学</text><text x="175" y="188">A-201 · 1–16周</text><text x="561" y="158">数据结构</text><text x="561" y="188">A-302 · 1–16周</text><text x="36" y="263">14:00</text><text x="36" y="291">15:40</text><text x="365" y="263">大学英语</text><text x="365" y="293">B-105 · 1–16周</text></g><text x="32" y="343" fill="#93a18c" font-size="12" font-family="sans-serif">此图片仅用于演示识别与核对流程</text></svg>';courseImage={name:'示例课表.svg（内置演示）',url:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)};openImageImport()}
function recognizeCourseDemo(){if(!courseImage)return toast('请先选择课表图片');courseRows=[{title:'高等数学',day:1,start:'08:00',end:'09:40',location:'A-201',from:1,to:16,pattern:'all',q:1},{title:'大学英语',day:3,start:'14:00',end:'15:40',location:'B-105',from:1,to:16,pattern:'all',q:1},{title:'数据结构',day:6,start:'08:00',end:'09:40',location:'A-302',from:1,to:16,pattern:'all',q:1}];reviewCourseImage()}
function courseField(i,key,v){courseRows[i][key]=['day','from','to','q'].includes(key)?Number(v):v}
function courseInput(i,key,label,type='text'){return '<label>'+label+'<input aria-label="课程'+(i+1)+' '+label+'" type="'+type+'" '+(['from','to'].includes(key)?'min="1" max="40"':'')+' value="'+esc(courseRows[i][key])+'" oninput="courseField('+i+',\''+key+'\',this.value)"></label>'}
function reviewCourseImage(){modal('<div class="modal-head"><h2>先核对，再加入日程</h2><button aria-label="关闭课表核对" onclick="closeModal()">✕</button></div><p class="desc">'+esc(courseImage?.name||'课表图片')+'　·　逐项校正后确认导入</p><div class="image-steps"><span>01 上传课表</span><b>02 核对课程</b><span>03 确认导入</span></div><div class="notice">以下是固定示例课程，与所上传图片内容无关。请核对并修改所有字段；真实版本将由视觉模型生成候选课程。若图片仅包含“第几节”，还需结合学校作息表转换为具体时间。</div><div class="form-group"><label for="course-term">学期第一周周一（周次换算基准）</label><input id="course-term" aria-label="学期第一周周一" type="date" value="'+courseTerm+'" onchange="courseTerm=this.value"><div class="tiny">默认日期为演示值，请按学校校历修改。</div></div>'+courseRows.map((c,i)=>'<div class="course-review"><div class="course-row-head"><b>课程 '+(i+1)+'</b><button type="button" class="tiny" onclick="courseRows.splice('+i+',1);reviewCourseImage()">移除此课程</button></div><div class="form-grid">'+courseInput(i,'title','课程名称')+'<label>星期<select aria-label="课程'+(i+1)+' 星期" onchange="courseField('+i+',\'day\',this.value)">'+['一','二','三','四','五','六','日'].map((x,d)=>'<option value="'+(d+1)+'" '+(c.day===d+1?'selected':'')+'>星期'+x+'</option>').join('')+'</select></label>'+courseInput(i,'start','开始时间','time')+courseInput(i,'end','结束时间','time')+courseInput(i,'location','地点')+'<label>重复规则<select aria-label="课程'+(i+1)+' 重复规则" onchange="courseField('+i+',\'pattern\',this.value)">'+[['all','每周'],['odd','单周'],['even','双周']].map(([v,t])=>'<option value="'+v+'" '+(c.pattern===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label>'+courseInput(i,'from','起始周','number')+courseInput(i,'to','结束周','number')+'<label style="grid-column:1/-1">四象限分类<select aria-label="课程'+(i+1)+' 四象限分类" onchange="courseField('+i+',\'q\',this.value)">'+labels.map((l,q)=>'<option value="'+q+'" '+(c.q===q?'selected':'')+'>'+l+'</option>').join('')+'</select></label></div></div>').join('')+'<button class="secondary" onclick="courseRows.push({title:\'\',day:1,start:\'08:00\',end:\'09:40\',location:\'\',from:1,to:16,pattern:\'all\',q:1});reviewCourseImage()">＋ 补充漏识别课程</button><p class="tiny">按周次生成具体日期，仅在所选周次出现；导入前会检查与已有固定任务的时间冲突。</p><div class="modal-footer"><button class="secondary" onclick="openImageImport()">返回图片</button><button class="primary" onclick="importReviewedCourses()">确认 '+courseRows.length+' 门课程并检查冲突</button></div>')}
function importReviewedCourses(){let base=new Date(courseTerm+'T12:00:00');if(!/^\d{4}-\d{2}-\d{2}$/.test(courseTerm)||isNaN(base)||base.getDay()!==1)return toast('请把学期起始日期设为第一周的周一');if(!courseRows.length)return toast('请至少保留一门课程');for(let c of courseRows){if(!c.title.trim()||!c.start||!c.end||c.start>=c.end)return toast('请补全课程名称并检查开始、结束时间');if(!Number.isInteger(c.from)||!Number.isInteger(c.to)||c.from<1||c.to>40||c.to<c.from)return toast('周次需为 1–40 的整数，且结束周不早于起始周')}
parsed=[];let stamp=Date.now();for(let c of courseRows){for(let w=c.from;w<=c.to;w++){if(c.pattern==='odd'&&w%2===0||c.pattern==='even'&&w%2!==0)continue;let d=new Date(base);d.setDate(d.getDate()+(w-1)*7+c.day-1);let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');parsed.push({id:stamp+parsed.length,title:c.title.trim(),date:key,start:c.start,end:c.end,location:c.location,repeat:'第 '+w+' 周 · '+({all:'每周',odd:'单周',even:'双周'}[c.pattern]),q:c.q,done:false,source:'课表图片核对录入'})}}if(!parsed.length)return toast('当前周次范围没有符合单双周规则的课程');parsed.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));commitParsed()}

function openImport(tab='text'){importTab=tab;modal('<div class="modal-head"><h2>让安排，从这里开始</h2><button onclick="closeModal()">✕</button></div><p class="desc">文字通知、课程安排或一件小事，都可以成为有序的计划。</p>'+importTabs(tab)+(tab==='text'?'<div class="form-group"><label>粘贴通知或课程安排</label><textarea id="raw" style="min-height:160px" placeholder="例如：10月24日14:00-15:30，图书馆203开展数学建模小组讨论。每行一条安排。"></textarea></div><div class="notice">原型使用规则演示识别与自动分类；识别结果需要你核对。正式版需接入智能体。</div><button class="tiny" onclick="document.getElementById(\'raw\').value=\'10月24日14:00-15:30，图书馆203开展数学建模小组讨论\\n10月25日前提交比赛报名表\'">填入示例文本 ↗</button><div class="modal-footer"><button class="primary" onclick="parseText()">识别并预览 →</button></div>':'<form onsubmit="manualSubmit(event)"><div class="form-group"><label>任务名称</label><input id="f-title" required placeholder="你准备完成什么？"></div><div class="form-grid"><div class="form-group"><label>任务类型</label><select id="f-type" onchange="document.getElementById(\'fixed-fields\').classList.toggle(\'hidden\',this.value!==\'fixed\');document.getElementById(\'flex-fields\').classList.toggle(\'hidden\',this.value===\'fixed\')"><option value="flex">灵活待办</option><option value="fixed">固定时间安排</option></select></div><div class="form-group"><label>计划日期</label><input type="date" id="f-date" value="'+date+'" required></div></div><div id="fixed-fields" class="hidden"><div class="form-grid"><div class="form-group"><label>开始时间</label><input type="time" id="f-start" value="14:00"></div><div class="form-group"><label>结束时间</label><input type="time" id="f-end" value="15:00"></div><div class="form-group"><label>地点</label><input id="f-location" placeholder="教室 / 线上会议"></div><div class="form-group"><label>重复规则</label><select id="f-repeat"><option>不重复</option><option>每周</option></select></div></div></div><div id="flex-fields"><div class="form-grid"><div class="form-group"><label>DDL</label><input id="f-ddl" type="date" value="'+date+'"></div><div class="form-group"><label>预计时长（分钟）</label><input id="f-duration" type="number" min="1" value="60"></div><div class="form-group"><label>建议时间</label><input id="f-suggest" placeholder="例如 16:00 – 17:00"></div><div class="form-group"><label>能力关联</label><select id="f-ability">'+abilities.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('')+'</select></div></div><div class="form-group"><label>完成标准</label><input id="f-standard" placeholder="例如：写出三个结论并整理参考文献"></div></div><div class="form-group"><label>四象限分类（可自行调整）</label><select id="f-q">'+labels.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('')+'</select></div><div class="modal-footer"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary" type="submit">添加到计划</button></div></form>'))}function val(id){return document.getElementById(id).value}function manualSubmit(e){e.preventDefault();let fixed=val('f-type')==='fixed';if(fixed&&val('f-start')>=val('f-end'))return toast('结束时间需晚于开始时间');let t={id:Date.now(),title:val('f-title'),date:val('f-date'),q:+val('f-q'),done:false,...(fixed?{start:val('f-start'),end:val('f-end'),location:val('f-location'),repeat:val('f-repeat')}:{ddl:val('f-ddl')||val('f-date'),duration:+val('f-duration')||60,suggest:val('f-suggest')||'自行安排',ability:+val('f-ability'),standard:val('f-standard')||'完成任务并检查结果'})};parsed=[t];commitParsed()}function parseText(){let raw=val('raw').trim();if(!raw)return toast('先输入一段通知或安排');parsed=raw.split('\n').filter(Boolean).map((line,i)=>{let m=line.match(/(\d{1,2})月(\d{1,2})日/),dt=m?'2026-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0'):date;let time=line.match(/(\d{1,2}:\d{2})\s*[-—至]\s*(\d{1,2}:\d{2})/);let q=/提交|截止|报名/.test(line)?(/重要|论文|实验|比赛/.test(line)?0:2):1;let title=line.replace(/\d{1,2}月\d{1,2}日[前]?/,'').replace(/\d{1,2}:\d{2}\s*[-—至]\s*\d{1,2}:\d{2}/,'').replace(/^[，,\s]+/,'');return {id:Date.now()+i,title,date:dt,q,done:false,...(time?{start:time[1].padStart(5,'0'),end:time[2].padStart(5,'0'),location:'待核对',repeat:'不重复'}:{ddl:dt,duration:60,suggest:'自行安排',ability:0,standard:'完成通知中的要求'})}});previewParsed('演示识别完成。预计时长、分类和地点均需人工核对。')}function previewParsed(msg){modal('<div class="modal-head"><h2>核对识别结果</h2><button onclick="closeModal()">✕</button></div><div class="notice">'+msg+'</div>'+parsed.map((t,i)=>'<div class="preview-item"><input aria-label="任务名称" value="'+esc(t.title)+'" onchange="parsed['+i+'].title=this.value"><div class="form-grid" style="margin-top:8px"><input aria-label="计划日期" type="date" value="'+t.date+'" onchange="parsed['+i+'].date=this.value;if(!parsed['+i+'].start)parsed['+i+'].ddl=this.value"><select aria-label="分类" onchange="parsed['+i+'].q=+this.value">'+labels.map((l,j)=>'<option value="'+j+'" '+(t.q===j?'selected':'')+'>'+l+'</option>').join('')+'</select></div><p class="tiny">'+(t.start?t.start+' – '+t.end+'　地点：'+esc(t.location):'预计 '+t.duration+' 分钟 · 完成标准：'+esc(t.standard))+'</p></div>').join('')+'<div class="modal-footer"><button class="secondary" onclick="openImport()">返回编辑</button><button class="primary" onclick="commitParsed()">确认加入 '+parsed.length+' 项日程</button></div>')}function conflictsFor(t,list){return list.filter(x=>x.start&&t.start&&x.start<t.end&&t.start<x.end&&(x.date===t.date||((x.repeat==='每周'||x.repeat==='每周六')&&x.date<=t.date&&new Date(x.date).getDay()===new Date(t.date).getDay())))}function commitParsed(){let conflict=[];let seen=[...tasks];for(let t of parsed){let c=conflictsFor(t,seen);if(c.length)conflict.push(...c);seen.push(t)}if(conflict.length){modal('<div class="modal-head"><h2>这个时段有些拥挤</h2><button onclick="closeModal()">✕</button></div><div class="notice">检测到固定任务时间重叠，请决定如何保留安排。</div>'+parsed.map(t=>'<div class="preview-item">新安排：'+esc(t.title)+'　'+(t.start||'')+' – '+(t.end||'')+'</div>').join('')+conflict.map(t=>'<div class="preview-item">已有安排：'+esc(t.title)+'　'+t.start+' – '+t.end+'</div>').join('')+'<div class="modal-footer"><button class="secondary" onclick="closeModal();toast(\'已保留原有安排\')">仅保留原任务</button><button class="secondary" onclick="resolveConflict(\'replace\')">以新任务替换</button><button class="primary" onclick="resolveConflict(\'both\')">均保留</button></div>');return}finishAdd()}function resolveConflict(mode){if(mode==='replace'){tasks=tasks.filter(x=>!parsed.some(t=>conflictsFor(t,[x]).length));let accepted=[];for(let t of parsed){accepted=accepted.filter(x=>!conflictsFor(t,[x]).length);accepted.push(t)}parsed=accepted}finishAdd()}function finishAdd(){let count=parsed.length;tasks.push(...parsed);save();date=parsed[0]?.date||date;timelineCenter=date;timelineMode='day';page='plan';render();closeModal();toast('已加入 '+count+' 项日程，四象限已同步')}
function report(){let accepted=evidence.filter(e=>e.status==='已接受');document.getElementById('content').innerHTML=head('看见成长，也看见依据。','能力不是一个简单的分数。每次更新，都需要可追溯、经你确认的证据。','<button class="primary" onclick="addEvidence()">＋　添加成长证据</button>')+'<div class="notice" style="margin-bottom:22px">本地规则演示：访客画像含示例数据，新账号从零条证据开始。仅已接受的证据参与等级展示；这不是正式能力测评。</div><div class="report-grid">'+abilities.map((a,i)=>{let n=confirmed[i]+accepted.filter(e=>e.dim===i).length;let level=n>=6?'稳步发展':n>=4?'逐渐形成':'探索阶段';return '<section class="panel ability"><h3>'+a+'</h3><div class="level">'+level+' <span style="font-size:12px;color:#8ba17e">'+(accepted.some(e=>e.dim===i)?'↗ 新证据已纳入':'→ 稳定')+'</span></div><p>置信度：'+(n>=6?'中等':'偏低')+'　·　已确认依据 '+n+' 条</p><div class="progress-bar"><i style="width:'+Math.min(n*11,85)+'%"></i></div><p>主要证据：'+esc(accepted.find(e=>e.dim===i)?.title||['研究问题清单与开题草稿','代码实现记录与系统流程图','实验日志与模型对照结果','论文局限分析与复盘记录','引用清单与检索记录','小组汇报与个人周反思'][i])+'</p><p>下一步：'+['把研究问题转化为可验证的假设','给代码补充模块图与设计解释','补充重复实验和误差来源说明','为结论列出一个替代解释','核查引用出处与论证对应关系','记录一次反馈及后续调整'][i]+'</p></section>'}).join('')+'</div><section class="panel evidence"><div class="panel-title">证据收件箱 <small>由你决定，什么能代表你的成长</small></div>'+evidence.map(e=>'<div class="evidence-row"><div class="avatar" style="font-size:15px">▤</div><div class="grow"><h4>'+esc(e.title)+'　<span class="pill">'+e.status+'</span></h4><p>'+esc(e.desc)+'</p><p style="margin-top:5px">'+esc(e.body)+'</p></div>'+(e.status==='已接受'||e.status==='已拒绝'?'<button class="tiny" onclick="evidenceState('+e.id+',\'待确认\')">重新审核</button>':'<button class="primary" onclick="evidenceState('+e.id+',\'已接受\')">接受</button><button class="secondary" onclick="editEvidence('+e.id+')">修改</button><button class="tiny" onclick="evidenceState('+e.id+',\'已拒绝\')">拒绝</button><button class="tiny" onclick="evidenceState('+e.id+',\'待观察\')">待观察</button>')+'</div>').join('')+'</section>'}function evidenceState(id,status){evidence.find(e=>e.id===id).status=status;save();report();toast(status==='已接受'?'证据已确认，能力报告已更新':'已标记为'+status+'，不纳入正式报告')}function addEvidence(){modal('<div class="modal-head"><h2>记录一份成长依据</h2><button onclick="closeModal()">✕</button></div><p class="desc">上传阶段作品、粘贴论文结果、行为记录、个人自述或外部反馈。</p><form onsubmit="submitEvidence(event)"><div class="form-group"><label>证据标题</label><input id="e-title" required placeholder="例如：第一次完成对照实验"></div><div class="form-grid"><div class="form-group"><label>来源类型</label><select id="e-source"><option>阶段作品</option><option>论文结果</option><option>行为记录</option><option>用户自述</option><option>外部反馈</option></select></div><div class="form-group"><label>关联能力</label><select id="e-dim">'+abilities.map((a,i)=>'<option value="'+i+'">'+a+'</option>').join('')+'</select></div></div><div class="form-group"><label>具体内容与依据</label><textarea id="e-body" required placeholder="做了什么？有什么结果？哪些材料能够支持？"></textarea></div><div class="form-group"><label>附件（原型仅保存文件名）</label><input type="file" id="e-file"></div><div class="notice">提交后生成候选证据，等待你接受、修改、拒绝或标记待观察。</div><div class="modal-footer"><button class="primary">生成候选证据</button></div></form>')}function submitEvidence(e){e.preventDefault();evidence.unshift({id:Date.now(),title:val('e-title'),desc:val('e-source')+' → '+abilities[+val('e-dim')]+(document.getElementById('e-file').files[0]?' · 附件：'+document.getElementById('e-file').files[0].name:''),body:val('e-body'),dim:+val('e-dim'),status:'待确认'});save();closeModal();report();toast('候选证据已生成，尚未更新能力报告')}function editEvidence(id){let e=evidence.find(x=>x.id===id);modal('<div class="modal-head"><h2>修改候选证据</h2><button onclick="closeModal()">✕</button></div><p class="desc">修改后回到待确认状态，由你决定是否接受。</p><input id="edit-title" value="'+esc(e.title)+'"><textarea id="edit-body" style="margin-top:15px">'+esc(e.body)+'</textarea><div class="modal-footer"><button class="primary" onclick="let e=evidence.find(x=>x.id==='+id+');e.title=val(\'edit-title\');e.body=val(\'edit-body\');e.status=\'待确认\';save();closeModal();report()">保存修改</button></div>')}
let recTarget='',recSteps=[];function recommend(){document.getElementById('content').innerHTML=head('让远一点的目标，有近一点的起点。','结合能力记录与可用时间，把长期准备拆成可以行动的小步骤。')+'<div class="rec-layout"><section class="panel rec-form"><div class="panel-title">你正在准备什么？</div><p class="subtitle">比赛、论文、考核，或任何想认真完成的目标。</p><form onsubmit="generateRec(event)"><div class="form-group"><label>长期准备型任务</label><input id="r-title" value="'+esc(recTarget||'准备大学生数学建模竞赛')+'" required></div><div class="form-grid"><div class="form-group"><label>目标截止日期</label><input id="r-ddl" type="date" value="2026-11-20" min="2026-10-25" required></div><div class="form-group"><label>每周可投入（小时）</label><input id="r-hours" type="number" min="1" max="80" value="6" required></div></div><div class="form-group"><label>想补足或优先关注的方面</label><textarea id="r-focus" placeholder="例如：实验设计经验不够，希望先熟悉建模验证流程。"></textarea></div><div class="preview-item" style="background:#f5f8f2"><b style="font-size:11px">✧ 参考你的能力画像</b><p class="tiny">计算与系统思维：稳步发展<br>实验验证与数据素养：'+((confirmed[2]+evidence.filter(e=>e.status==='已接受'&&e.dim===2).length)>=4?'逐渐形成':'探索阶段')+'<br>优先增加验证与结果解释的练习。</p></div><div class="notice">联网检索与智能方案生成在本原型中为演示；未实际调用 web search，不展示虚构来源。</div><button class="primary" style="width:100%;margin-top:10px">生成准备方案　→</button></form></section><section class="panel rec-form" id="rec-result">'+(recSteps.length?recHTML():'<div style="text-align:center;padding:70px 25px"><div style="font-size:50px;color:#9fb39b">✧</div><h3 style="font-size:16px;font-weight:500">大目标，可以从一小步开始</h3><p class="subtitle">输入目标后，查看可选择、可调整的阶段安排。</p></div>')+'</section></div>'}function generateRec(e){e.preventDefault();recTarget=val('r-title');let ddl=val('r-ddl'),h=+val('r-hours'),focus=val('r-focus');let start=new Date(today+'T12:00:00'),end=new Date(ddl+'T12:00:00');let span=Math.max(1,Math.floor((end-start)/86400000));let title=recTarget.replace(/^准备/,'');recSteps=[{title:'明确「'+title+'」的目标与要求',desc:'梳理提交要求、评价标准与现有资源，形成一页任务清单。',dim:0},{title:'完成基础练习与资料整理',desc:'选择一个代表性小任务实践，记录检索来源与方法选择。',dim:1},{title:'进行验证并解释结果',desc:(focus?'围绕「'+focus+'」安排练习；':'')+'设计对照，记录误差与局限，形成结果说明。',dim:2},{title:'整理成果并开展一次复盘',desc:'核对完成标准，收集一次同伴反馈，补齐最终材料。',dim:5}].map((s,i)=>{let d=new Date(start);d.setDate(d.getDate()+Math.max(1,Math.floor(span*(i+1)/4)));return {...s,date:d.toISOString().slice(0,10),duration:Math.min(180,Math.max(30,Math.round(h*60/4)))}});document.getElementById('rec-result').innerHTML=recHTML();toast('演示方案已生成，可勾选采纳')}function recHTML(){return '<div class="panel-title">为你拆解的四个阶段 <span class="pill">示例方案</span></div><p class="subtitle">建议依据：能力画像中的验证经验相对较少，增加对照与复盘环节。</p>'+recSteps.map((s,i)=>'<div class="rec-step"><div class="step-num">0'+(i+1)+'</div><div style="flex:1"><h3>'+esc(s.title)+'</h3><p>'+esc(s.desc)+'</p><p style="margin-top:8px;color:#789271">'+s.date+'　·　'+s.duration+' 分钟</p></div><input style="width:16px;flex-shrink:0" type="checkbox" aria-label="采纳阶段'+(i+1)+'" id="r-check-'+i+'" checked></div>').join('')+'<div class="modal-footer"><button class="secondary" onclick="recSteps=[];recommend()">暂不采纳</button><button class="primary" onclick="adoptRec()">采纳所选并加入日程</button></div>'}function adoptRec(){let chosen=recSteps.filter((s,i)=>document.getElementById('r-check-'+i).checked);if(!chosen.length)return toast('请至少选择一个阶段');tasks.push(...chosen.map((s,i)=>({id:Date.now()+i,title:s.title,date:s.date,ddl:s.date,duration:s.duration,suggest:'自行安排',ability:s.dim,standard:s.desc,q:1,done:false})));save();recSteps=[];date=chosen[0].date;timelineCenter=date;timelineMode='day';page='plan';render();toast('已采纳 '+chosen.length+' 个阶段并加入计划')}

function personal(){document.getElementById('content').innerHTML=head('我的个人空间','让计划、证据与个人偏好，在这里汇合。','<button class="secondary" onclick="logout()">退出登录</button>')+`<div class="rec-layout"><section class="panel rec-form"><div class="panel-title">个人资料</div><p class="subtitle">${esc(activeAccount.email)}</p><form onsubmit="saveProfile(event)"><div class="form-group"><label for="p-name">昵称</label><input id="p-name" maxlength="24" required value="${esc(activeAccount.name)}"></div><div class="form-group"><label for="p-motto">个人格言</label><textarea id="p-motto" maxlength="100" placeholder="写下想对自己说的话；留空则展示每日寄语">${esc(activeAccount.motto||'')}</textarea></div><button class="primary">保存个人设置</button></form></section><section class="panel rec-form"><div class="panel-title">能力与成长</div><p class="subtitle">查看六维能力画像，管理和确认成长证据。</p><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><div class="stat-top">我的任务</div><div class="stat-num">${tasks.length}</div></div><div class="stat"><div class="stat-top">已接受证据</div><div class="stat-num">${evidence.filter(e=>e.status==='已接受').length}</div></div></div><button class="primary" onclick="page='report';render()">查看能力报告 →</button><div class="notice">本地演示账号：未验证邮箱，数据仅保存在此浏览器；不支持跨设备同步或真实多人服务。请勿使用常用密码或存放敏感资料。</div></section></div>`}

async function passwordHash(password,salt){const bytes=Uint8Array.from(atob(salt),c=>c.charCodeAt(0));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes,iterations:210000,hash:'SHA-256'},key,256);return btoa(String.fromCharCode(...new Uint8Array(bits)))}
async function authenticate(e,mode){e.preventDefault();if(authRequestPending)return;authRequestPending=true;const button=document.getElementById('auth-submit'),error=document.getElementById('auth-error');button.disabled=true;error.textContent='';try{if(!crypto?.subtle)throw Error('当前浏览器不支持本地密码校验，请使用现代浏览器或 localhost 打开。');const email=val('auth-email').trim().toLowerCase(),password=val('auth-password');if(!email||password.length<8)throw Error('请填写有效邮箱和至少 8 位测试密码');localAccounts=readJSON(LOCAL_PREFIX+'accounts',[]);let account=localAccounts.find(a=>a.email===email);if(mode==='register'){if(account)throw Error('该邮箱已在此浏览器注册，请登录');if(password!==val('auth-confirm'))throw Error('两次密码不一致');let name=val('auth-name').trim();if(!name)throw Error('请填写昵称');let salt=btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));account={id:crypto.randomUUID(),email,name,motto:'',salt,hash:await passwordHash(password,salt)};localAccounts=readJSON(LOCAL_PREFIX+'accounts',[]);if(localAccounts.some(a=>a.email===email))throw Error('该邮箱已注册，请登录');localAccounts.push(account);localStorage.setItem(LOCAL_PREFIX+'accounts',JSON.stringify(localAccounts))}else{if(!account||await passwordHash(password,account.salt)!==account.hash)throw Error('邮箱或测试密码不正确')}if(!button.isConnected)return;save();sessionStorage.setItem(LOCAL_PREFIX+'session',account.id);activeAccount=account;loadAccount();page='plan';await enterAuthenticatedBoard();toast(mode==='register'?'本地账号已创建':'已登录本地账号')}catch(err){if(error.isConnected)error.textContent=err.message||'操作失败，请检查浏览器存储'}finally{authRequestPending=false;if(button.isConnected)button.disabled=false}}

 return seeds[q].map(([title,standard,duration],i)=>({title:first&&i===0?first.title+' · '+title:title,standard,duration,ability:first?.ability??dim,q,date:today,ddl:first?.ddl&&first.ddl>=today?first.ddl:today,suggest:'自行安排',done:false,reason:first?'结合「'+first.title+'」及当前象限的行动方式':'结合当前象限与能力记录较少的维度：'+abilities[dim]}));
}
function chooseQuadrant(q){if(!Number.isInteger(q)||q<0||q>3)return;selectedQuadrant=q;render();requestAnimationFrame(()=>document.getElementById('quadrant-recommend-title')?.focus({preventScroll:true}))}
function clearQuadrantSelection(){selectedQuadrant=null;render()}
function quadrantRecommendationHTML(q){let proposals=quadrantRecommendations(q);return '<aside class="quadrant-recommendations" aria-label="当前象限的个性化推荐"><div class="modal-head"><div><span class="gallery-kicker">YOUR NEXT STEP</span><h2 id="quadrant-recommend-title" tabindex="-1">推荐任务</h2></div><button onclick="clearQuadrantSelection()" aria-label="关闭推荐面板">✕</button></div><p class="subtitle">'+labels[q]+' · 根据任务与本地能力记录提供规则建议</p>'+proposals.map((r,i)=>'<article class="suggestion-card"><span class="gallery-kicker">0'+(i+1)+' · '+r.duration+' 分钟</span><h3>'+esc(r.title)+'</h3><p>'+esc(r.standard)+'</p><p class="suggestion-reason">'+esc(r.reason)+'</p><button class="secondary" onclick="adoptQuadrantRecommendation('+q+','+i+')">＋ 加入此象限</button></article>').join('')+'<details class="quadrant-goal"><summary>拆解一个长期目标</summary><p class="tiny">本地模板方案，可编辑后采纳。</p><form onsubmit="generateRec(event)"><label>目标<input id="r-title" required placeholder="例如：准备期末考试" value="'+esc(recTarget||'')+'"></label><label>截止日期<input id="r-ddl" type="date" min="'+today+'" required></label><label>每周可投入（小时）<input id="r-hours" type="number" min="1" max="80" value="6" required></label><label>重点方向<textarea id="r-focus" placeholder="希望优先练习什么？"></textarea></label><button class="secondary">生成阶段安排</button></form><div id="rec-result">'+(recSteps.length?recHTML():'')+'</div></details></aside>'}
function adoptQuadrantRecommendation(q,i){if(!activeAccount)return;let proposal=quadrantRecommendations(q)[i];if(!proposal)return;let {reason,...task}=proposal;if(tasks.some(t=>t.q===q&&!t.done&&t.title===task.title))return toast('此推荐任务已在当前象限');let id=Math.max(Date.now(),...tasks.map(t=>Number(t.id)||0))+1;tasks.push({...task,id});if(!save()){tasks.pop();return}render();toast('推荐任务已加入'+labels[q])}
matrix=function(){let q=selectedQuadrant;document.getElementById('content').innerHTML=head('把精力，<br>放在值得的事上。','点击一个象限，查看具体任务与适合下一步的推荐。')+'<div class="division-workspace '+(q!==null?'has-recommendations':'')+'"><section class="editorial-quadrants">'+quadHTML()+'</section>'+(q!==null?quadrantRecommendationHTML(q):'')+'</div>';document.querySelectorAll('[data-drop-q]').forEach(el=>{let key=Number(el.dataset.dropQ);el.classList.toggle('quadrant-selected',q===key);let label=el.querySelector('.q-label');if(label){label.setAttribute('role','button');label.tabIndex=0;label.setAttribute('aria-expanded',String(q===key));label.setAttribute('aria-label',labels[key]+'，查看任务与推荐');label.addEventListener('click',()=>chooseQuadrant(key));label.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseQuadrant(key)}})}el.addEventListener('click',e=>{if(e.target.closest('button,select,input,a,.q-label'))return;if(Date.now()<dragClickUntil)return;chooseQuadrant(key)})})};
recommend=function(){page='matrix';if(selectedQuadrant===null)selectedQuadrant=1;render()};
// Keep generated plans inside the selected quadrant instead of reopening a separate page.
recHTML=(function(original){return function(){return original().replace("recSteps=[];recommend()","recSteps=[];render()")}})(recHTML);
adoptRec=function(){let chosen=recSteps.filter((_,i)=>document.getElementById('r-check-'+i)?.checked);if(!chosen.length)return toast('请至少选择一个阶段');let before=tasks.length,id=Math.max(Date.now(),...tasks.map(t=>Number(t.id)||0))+1,q=selectedQuadrant??1;tasks.push(...chosen.map((step,i)=>({id:id+i,title:step.title,date:step.date,ddl:step.date,duration:step.duration,suggest:'自行安排',ability:step.dim,standard:step.desc,q,done:false})));if(!save()){tasks.splice(before);return}recSteps=[];render();toast('阶段任务已加入'+labels[q])};
const renderBeforeIntegratedViews=render;
render=function(){let popup=document.getElementById('day-popup-content'),sc=document.getElementById('day-scroll'),scroll=sc?.scrollTop;if(!activeAccount||quadrantOwner!==activeAccount.id){selectedQuadrant=null;quadrantOwner=activeAccount?.id??null}if(page==='recommend')page='matrix';if(page!=='plan'&&popup)closeModal();renderBeforeIntegratedViews();if(page==='plan'&&popup&&document.getElementById('day-popup-content')){popup.innerHTML=dayFocusHTML();if(document.getElementById('day-scroll'))document.getElementById('day-scroll').scrollTop=scroll||0}};

document.addEventListener('visibilitychange',()=>{if(document.hidden)stopLandingDistortion();else if(!activeAccount&&!landingMotionPaused)startLandingDistortion()});
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page==='personal')return openPersonal();page=b.dataset.page;render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
